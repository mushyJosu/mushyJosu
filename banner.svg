<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- 1. FONDO Y BORDE: rectángulo negro con borde blanco fino -->
  <rect x="1" y="1" width="898" height="228" fill="#000000" stroke="#ffffff" stroke-width="1"/>

  <!-- 2. BARRA SUPERIOR: línea gris y tres puntos (ventana de terminal) -->
  <line x1="1" y1="40" x2="899" y2="40" stroke="#333333" stroke-width="1"/>
  <circle cx="24" cy="20" r="5" fill="#cc0000"/>
  <circle cx="44" cy="20" r="5" fill="#333333"/>
  <circle cx="64" cy="20" r="5" fill="#333333"/>
  <text x="90" y="25" font-family="'Courier New', monospace" font-size="12" fill="#777777">mushyJosu@github:~</text>

  <!-- 3. TEXTO: el ">" va en blanco y el contenido en rojo -->
  <text x="30" y="90" font-family="'Courier New', monospace" font-size="28" font-weight="bold">
    <tspan fill="#ffffff">&gt; </tspan><tspan fill="#cc0000">mushyJosu</tspan>
  </text>

  <text x="30" y="130" font-family="'Courier New', monospace" font-size="20">
    <tspan fill="#ffffff">&gt; </tspan><tspan fill="#cc0000">Java · C++ · SQL · Kotlin</tspan>
  </text>

  <text x="30" y="162" font-family="'Courier New', monospace" font-size="16">
    <tspan fill="#ffffff">&gt; </tspan><tspan fill="#cc0000">estudiante de TI e innovación digital</tspan>
  </text>

  <!-- 4. CURSOR PARPADEANTE: un rectángulo rojo que aparece y desaparece -->
  <text x="30" y="200" font-family="'Courier New', monospace" font-size="20" fill="#ffffff">&gt;</text>
  <rect x="52" y="182" width="11" height="20" fill="#cc0000">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>

</svg>
